name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Bandit (segurança)
        run: bandit -r site_extractor -c pyproject.toml

      - name: Semgrep (análise semântica)
        run: semgrep --config .semgrep.yml --config p/python --error .

      - name: Testes (pytest)
        run: pytest -q
